name: Update videos

on:
  schedule:
    # Every six hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge new videos from the YouTube RSS feed
        id: merge
        run: python3 update_videos.py

      - name: Rebuild the static site
        if: steps.merge.outputs.changed == 'true'
        run: python3 build.py

      - name: Commit and push if the catalog changed
        if: steps.merge.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/site.json index.html videos.html shorts.html about.html sitemap.xml robots.txt destinations
          if git diff --cached --quiet; then
            echo "Merge reported a change, but the working tree is clean."
            exit 0
          fi
          COUNT=$(python3 -c "print(len('${{ steps.merge.outputs.added }}'.split(',')) if '${{ steps.merge.outputs.added }}' else 0)")
          if [ "$COUNT" = "1" ]; then
            MSG="Add 1 new video from the YouTube feed"
          else
            MSG="Add $COUNT new videos from the YouTube feed"
          fi
          git commit -m "$MSG"
          git push
