name: Update and publish videos

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Main-film releases: Wednesday and Saturday, six pm Central.
    - cron: "0 18 * * 3,6"
      timezone: America/Chicago
    # Retry feed propagation or a delayed run, and keep normal RSS updates.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totin-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install image build dependency
        run: python -m pip install Pillow==13.0.0
      - name: Verify release timing, privacy gates and generated pages
        run: python -m unittest discover -s tests -v

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install image build dependency
        run: python -m pip install Pillow==13.0.0

      - name: Release due films whose public YouTube embeds are confirmed
        id: releases
        run: python release_videos.py

      - name: Merge other public videos from the YouTube feed
        id: rss
        run: python update_videos.py

      - name: Rebuild the website
        if: steps.releases.outputs.changed == 'true' || steps.rss.outputs.changed == 'true' || github.event_name != 'schedule'
        run: python build.py

      - name: Configure GitHub Pages
        if: steps.releases.outputs.changed == 'true' || steps.rss.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Package public website files
        if: steps.releases.outputs.changed == 'true' || steps.rss.outputs.changed == 'true' || github.event_name != 'schedule'
        run: python package_site.py

      - name: Upload GitHub Pages artifact
        if: steps.releases.outputs.changed == 'true' || steps.rss.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # GITHUB_TOKEN pushes do not trigger a Pages build. Deploy explicitly.
      - name: Deploy the updated website
        id: deployment
        if: steps.releases.outputs.changed == 'true' || steps.rss.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4

      # Persist only after successful deployment. A failed deployment leaves the
      # source catalog unchanged, so the next scheduled run retries the release.
      - name: Save successfully deployed articles and catalog entries
        if: steps.deployment.outcome == 'success' && (steps.releases.outputs.changed == 'true' || steps.rss.outputs.changed == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/site.json data/blog.json data/new-england-release-state.json
          git add '*.html' sitemap.xml robots.txt destinations trips blog assets/heroes
          if ! git diff --cached --quiet; then
            git commit -m "Publish newly released YouTube films and website articles"
            git push
          fi
